<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Roldanas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --teal: #008080;
    --teal-dark: #045f5f;
    --charcoal: #5C5D54;
    --bg: #F5F6F4;
    --card: #FFFFFF;
    --border: #D8DAD3;
    --text: #2C2C2A;
    --text-muted: #6B6C64;
    --danger: #B23A2E;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 0 0 60px;
  }
  header {
    background: #009394;
    color: #fff;
    padding: 20px 20px 18px;
  }
  header h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    opacity: 0.85;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .field {
    margin-bottom: 16px;
  }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 6px;
  }
  label .opt {
    font-weight: 400;
    color: var(--text-muted);
    font-size: 12px;
  }
  input, select, textarea {
    width: 100%;
    padding: 12px 12px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(0,128,128,0.15);
  }
  textarea { resize: vertical; min-height: 70px; }
  .radio-group {
    display: flex;
    gap: 10px;
  }
  .radio-option {
    flex: 1;
    position: relative;
  }
  .radio-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }
  .radio-option span {
    display: block;
    text-align: center;
    padding: 12px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    pointer-events: none;
  }
  .radio-option input[type="radio"]:checked + span {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }
  .hidden { display: none !important; }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--teal-dark);
    margin: 0 0 12px;
  }
  button#btnEnviar {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--teal);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button#btnEnviar:active { background: var(--teal-dark); }
  button#btnEnviar:disabled { background: var(--text-muted); cursor: default; }
  .status {
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: #E1F5EE; color: #085041; border: 1px solid #5DCAA5; }
  .status.err { background: #FCEBEB; color: #791F1F; border: 1px solid #F09595; }
  .status.loading { background: #F1EFE8; color: var(--charcoal); border: 1px solid var(--border); }
  .download-link {
    display: block;
    text-align: center;
    margin-top: 10px;
    padding: 14px;
    background: var(--charcoal);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
  }
  .download-link:active { opacity: 0.85; }
</style>
</head>
<body>

<header>
  <h1>Registro de troca de roldanas</h1>
  <p>Preencha os campos abaixo. O PDF é gerado e baixado no celular; o registro vai para a lista do GEFIL.</p>
</header>

<main>
  <form id="formRoldana">

    <div class="card">
      <p class="section-title">Identificação</p>

      <div class="field">
        <label for="data">Data</label>
        <input type="date" id="data" required>
      </div>

      <div class="field">
        <label for="hora">Hora</label>
        <select id="hora" required></select>
      </div>

      <div class="field">
        <label>Turno</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="turno" value="Dia" required>
            <span>Dia</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="turno" value="Noite">
            <span>Noite</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="letra">Letra</label>
        <select id="letra" required>
          <option value="">Selecione</option>
          <option>A</option><option>B</option><option>C</option><option>D</option>
        </select>
      </div>

      <div class="field">
        <label for="nome">Nome do colaborador</label>
        <input type="text" id="nome" required>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Identificação do ativo</p>

      <div class="field">
        <label for="filtro">Filtro</label>
        <select id="filtro" required>
          <option value="">Selecione</option>
          <option>FL-002</option><option>FL-003</option><option>FL-004</option>
        </select>
      </div>

      <div class="field">
        <label for="componenteFiltro">Componente do Filtro</label>
        <select id="componenteFiltro" required>
          <option value="">Selecione</option>
          <option>Trolley</option>
          <option>Carro Deslocador</option>
          <option>Placas</option>
        </select>
      </div>

      <div class="field">
        <label for="placa">Posição</label>
        <select id="placa" required></select>
      </div>

      <div class="field">
        <label>Lado</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="lado" value="LD - Fixo" required>
            <span>LD – Fixo</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="lado" value="LE - Móvel">
            <span>LE – Móvel</span>
          </label>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Detalhes da troca</p>

      <div class="field">
        <label>Tipo de troca</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="tipoTroca" value="Preventiva" required>
            <span>Preventiva</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="tipoTroca" value="Corretiva">
            <span>Corretiva</span>
          </label>
        </div>
      </div>

      <div class="field hidden" id="campoMotivoPreventiva">
        <label for="motivoPreventiva">Motivo</label>
        <select id="motivoPreventiva">
          <option value="">Selecione</option>
          <option>Folga Axial</option>
          <option>Folga Radial</option>
          <option>Folga Radial/Axial</option>
          <option>Abertura de mais de 3mm da tampa</option>
          <option>Desgaste por Utilização</option>
        </select>
      </div>

      <div class="field hidden" id="campoMotivoCorretiva">
        <label for="motivoCorretiva">Motivo</label>
        <select id="motivoCorretiva">
          <option value="">Selecione</option>
          <option>Quebra do parafuso de fixação</option>
          <option>Rolamento danificado</option>
          <option>Travamento</option>
          <option>Quebra por desalinhamento de placa</option>
        </select>
      </div>

      <div class="field">
        <label for="evidencia">Evidência (foto) <span class="opt">(opcional)</span></label>
        <input type="file" id="evidencia" accept="image/*">
      </div>

      <div class="field">
        <label for="observacoes">Observações <span class="opt">(opcional)</span></label>
        <textarea id="observacoes"></textarea>
      </div>
    </div>

    <button type="submit" id="btnEnviar">Enviar registro</button>
    <div class="status" id="status"></div>
    <a href="#" id="linkDownload" class="hidden download-link" download>Baixar PDF do registro</a>
  </form>
</main>

<script>
// ===================================================================
// CONFIGURAÇÃO — substitua pela URL gerada pelo gatilho HTTP do fluxo
// ===================================================================
const FLOW_URL = "https://defaultc9f830b72f3f494cbe47f76f7ea235.6a.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/24b813b36cbf438994014d3786e9f345/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=aU7yn83SRTC_5j12sddz-MYvzun4BWobfUJNHt7Y0Yg";

// ---- Popular horas (00:00 a 23:00) ----
const selectHora = document.getElementById('hora');
selectHora.innerHTML = '<option value="">Selecione</option>' +
  Array.from({length: 24}, (_, i) => {
    const h = String(i).padStart(2, '0') + ':00';
    return `<option value="${h}">${h}</option>`;
  }).join('');

// ---- Região -> Posição (opções dependem da região escolhida) ----
const selectComponenteFiltro = document.getElementById('componenteFiltro');
const selectPlaca = document.getElementById('placa');

function popularPosicao(qtd) {
  selectPlaca.innerHTML = '<option value="">Selecione</option>' +
    Array.from({length: qtd}, (_, i) => `<option>${i + 1}</option>`).join('');
}

function atualizarPosicao() {
  const componenteFiltro = selectComponenteFiltro.value;
  if (componenteFiltro === 'Trolley' || componenteFiltro === 'Carro Deslocador') {
    popularPosicao(2);
  } else if (componenteFiltro === 'Placas') {
    popularPosicao(121);
  } else {
    selectPlaca.innerHTML = '<option value="">Selecione</option>';
  }
}

selectComponenteFiltro.addEventListener('change', atualizarPosicao);
atualizarPosicao();

// ---- Lógica condicional: Tipo de troca -> Motivo ----
const radiosTipoTroca = document.querySelectorAll('input[name="tipoTroca"]');
const campoMotivoPreventiva = document.getElementById('campoMotivoPreventiva');
const campoMotivoCorretiva = document.getElementById('campoMotivoCorretiva');
const selectMotivoPreventiva = document.getElementById('motivoPreventiva');
const selectMotivoCorretiva = document.getElementById('motivoCorretiva');

function atualizarMotivo() {
  const tipo = document.querySelector('input[name="tipoTroca"]:checked')?.value;
  campoMotivoPreventiva.classList.add('hidden');
  campoMotivoCorretiva.classList.add('hidden');
  selectMotivoPreventiva.required = false;
  selectMotivoCorretiva.required = false;

  if (tipo === 'Preventiva') {
    campoMotivoPreventiva.classList.remove('hidden');
    selectMotivoPreventiva.required = true;
  } else if (tipo === 'Corretiva') {
    campoMotivoCorretiva.classList.remove('hidden');
    selectMotivoCorretiva.required = true;
  }
}
radiosTipoTroca.forEach(r => r.addEventListener('change', atualizarMotivo));

// ---- Envio do formulário ----
const form = document.getElementById('formRoldana');
const btnEnviar = document.getElementById('btnEnviar');
const status = document.getElementById('status');
const linkDownload = document.getElementById('linkDownload');
let pdfUrlAtual = null;

function mostrarStatus(tipo, texto) {
  status.className = 'status show ' + tipo;
  status.textContent = texto;
}

function limparLinkAnterior() {
  if (pdfUrlAtual) {
    URL.revokeObjectURL(pdfUrlAtual);
    pdfUrlAtual = null;
  }
  linkDownload.classList.add('hidden');
}

function comprimirImagem(arquivo, maxLargura, qualidade) {
  // A foto não sai mais do celular: só entra no PDF. Por isso pode ter mais resolução.
  maxLargura = maxLargura || 1200;
  qualidade = qualidade || 0.8;
  return new Promise((resolve, reject) => {
    if (!arquivo) { resolve(null); return; }
    const leitor = new FileReader();
    leitor.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let largura = img.width, altura = img.height;
        if (largura > maxLargura) { altura = Math.round(altura * (maxLargura / largura)); largura = maxLargura; }
        const canvas = document.createElement('canvas');
        canvas.width = largura; canvas.height = altura;
        canvas.getContext('2d').drawImage(img, 0, 0, largura, altura);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', qualidade), largura, altura });
      };
      img.onerror = () => reject(new Error('Não foi possível processar a foto selecionada.'));
      img.src = e.target.result;
    };
    leitor.onerror = () => reject(new Error('Não foi possível ler a foto selecionada.'));
    leitor.readAsDataURL(arquivo);
  });
}

// ---- ID do registro (mesmo formato usado pelo fluxo: RLD-AAAAMMDD-HHMMSS) ----
function gerarIdRegistro() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `RLD-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function fmtData(iso) { if (!iso) return ''; const a = iso.split('-'); return a.length === 3 ? `${a[2]}/${a[1]}/${a[0]}` : iso; }

// ---- PDF gerado no próprio celular (layout equivalente ao antigo HTML do fluxo) ----
function gerarPdf(p, foto) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 18, teal = [0,128,128], text = [44,44,42], label = [92,93,84], muted = [107,108,100], line = [216,218,211];
  pdf.setFillColor(...teal); pdf.rect(0, 0, W, 4, 'F');
  pdf.setFont('helvetica','bold'); pdf.setFontSize(18); pdf.setTextColor(...teal);
  pdf.text('Registro de Troca de Roldana', M, 20);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10); pdf.setTextColor(...muted);
  pdf.text('ID do registro: ' + p.idRegistro, M, 26.5);
  pdf.text('Ero Copper · Operação Filtragem · GEFIL', W - M, 26.5, { align: 'right' });
  pdf.setDrawColor(...line); pdf.setLineWidth(0.3); pdf.line(M, 30, W - M, 30);

  const linhas = [
    ['Data', fmtData(p.data)], ['Hora', p.hora], ['Turno', p.turno], ['Letra', p.letra], ['Nome', p.nome],
    ['Filtro', p.filtro], ['Componente do Filtro', p.componenteFiltro], ['Posição / Placa', p.placa], ['Lado', p.lado],
    ['Tipo de Troca', p.tipoTroca], ['Motivo', p.motivo], ['Observações', p.observacoes || '—']
  ];
  let y = 38; const colL = M, colV = M + 52, wV = W - M - colV;
  linhas.forEach(([k, v]) => {
    pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5); pdf.setTextColor(...label); pdf.text(k, colL, y);
    pdf.setFont('helvetica','normal'); pdf.setTextColor(...text);
    const tx = pdf.splitTextToSize(String(v ?? ''), wV);
    pdf.text(tx, colV, y);
    y += Math.max(1, tx.length) * 5 + 3.5;
    pdf.setDrawColor(...line); pdf.line(M, y - 2.2, W - M, y - 2.2);
  });

  y += 4;
  pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5); pdf.setTextColor(...label); pdf.text('Evidência (foto)', colL, y);
  if (foto) {
    const maxW = W - 2*M, maxH = 275 - (y + 4);
    let w = maxW, h = w * foto.altura / foto.largura;
    if (h > maxH) { h = maxH; w = h * foto.largura / foto.altura; }
    if (h > 120) { h = 120; w = h * foto.largura / foto.altura; }
    pdf.addImage(foto.dataUrl, 'JPEG', colL, y + 4, w, h);
    pdf.setDrawColor(...line); pdf.rect(colL, y + 4, w, h);
    y += h + 10;
  } else {
    pdf.setFont('helvetica','normal'); pdf.setTextColor(...text); pdf.text('Sem foto anexada', colV, y); y += 8;
  }

  pdf.setFont('helvetica','normal'); pdf.setFontSize(8.5); pdf.setTextColor(...muted);
  pdf.text('PDF gerado em: ' + new Date().toLocaleString('pt-BR'), M, 287);
  pdf.text('Ero Copper Corp. | TSX: ERO | NYSE: ERO', W - M, 287, { align: 'right' });
  return pdf;
}

// ---- Fila de reenvio: registros que não chegaram ao GEFIL ficam no celular e saem na próxima abertura ----
const FILA_KEY = 'roldanas_fila_envio';
function lerFila() { try { return JSON.parse(localStorage.getItem(FILA_KEY) || '[]'); } catch { return []; } }
function salvarFila(f) { try { localStorage.setItem(FILA_KEY, JSON.stringify(f)); } catch {} }

async function enviarAoFluxo(payload) {
  const resp = await fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp;
}

async function reenviarPendentes() {
  const fila = lerFila(); if (!fila.length) return;
  const restantes = [];
  for (const p of fila) { try { await enviarAoFluxo(p); } catch { restantes.push(p); } }
  salvarFila(restantes);
  if (restantes.length < fila.length) mostrarStatus('ok', `${fila.length - restantes.length} registro(s) pendente(s) enviado(s) ao GEFIL.`);
}
window.addEventListener('load', () => { if (navigator.onLine) reenviarPendentes(); });
window.addEventListener('online', reenviarPendentes);

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const filtro = document.getElementById('filtro').value;
  const tipoTroca = document.querySelector('input[name="tipoTroca"]:checked')?.value;
  const motivo = tipoTroca === 'Preventiva' ? selectMotivoPreventiva.value : selectMotivoCorretiva.value;
  const arquivoEvidencia = document.getElementById('evidencia').files[0] || null;

  btnEnviar.disabled = true;
  limparLinkAnterior();
  mostrarStatus('loading', 'Gerando PDF…');

  let foto = null;
  try { foto = await comprimirImagem(arquivoEvidencia); }
  catch (err) { mostrarStatus('err', err.message); btnEnviar.disabled = false; return; }

  const payload = {
    idRegistro: gerarIdRegistro(),
    data: document.getElementById('data').value,
    hora: selectHora.value,
    turno: document.querySelector('input[name="turno"]:checked')?.value,
    letra: document.getElementById('letra').value,
    nome: document.getElementById('nome').value,
    filtro: filtro,
    componenteFiltro: selectComponenteFiltro.value,
    placa: selectPlaca.value,
    lado: document.querySelector('input[name="lado"]:checked')?.value,
    tipoTroca: tipoTroca,
    motivo: motivo,
    observacoes: document.getElementById('observacoes').value,
    temFoto: !!foto
  };

  // 1) PDF local, com a foto, baixado na hora
  try {
    const pdf = gerarPdf(payload, foto);
    const blob = pdf.output('blob');
    const url = URL.createObjectURL(blob);
    const nomeArquivo = payload.idRegistro + '.pdf';
    pdfUrlAtual = url; linkDownload.href = url; linkDownload.download = nomeArquivo; linkDownload.classList.remove('hidden');
    const a = document.createElement('a'); a.href = url; a.download = nomeArquivo; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch (err) {
    mostrarStatus('err', 'Falha ao gerar o PDF: ' + err.message); btnEnviar.disabled = false; return;
  }

  // 2) Só os campos vão para o fluxo (sem foto, sem PDF)
  mostrarStatus('loading', 'PDF gerado. Enviando registro ao GEFIL…');
  try {
    await enviarAoFluxo(payload);
    mostrarStatus('ok', `Registro ${payload.idRegistro} enviado ao GEFIL. Se o PDF não baixou automaticamente, use o botão abaixo.`);
  } catch (err) {
    const fila = lerFila(); fila.push(payload); salvarFila(fila);
    mostrarStatus('err', `PDF baixado, mas o registro ${payload.idRegistro} não chegou ao GEFIL (${err.message}). Ele ficou guardado neste celular e será reenviado automaticamente quando houver conexão.`);
  }

  form.reset();
  campoMotivoPreventiva.classList.add('hidden');
  campoMotivoCorretiva.classList.add('hidden');
  atualizarPosicao();
  btnEnviar.disabled = false;
});
</script>

</body>
</html>
